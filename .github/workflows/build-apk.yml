name: Build & Release PingReach APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PingReach.apk
          ls -lh PingReach.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingReach-APK
          path: PingReach.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: app-latest
          name: "PingReach Android App (Latest)"
          body: |
            ## 📱 PingReach Android App
            
            This APK connects to **https://ping-reach.vercel.app**.
            
            - **Auto-Updates**: Whenever you push updates to GitHub, they deploy to Vercel and appear instantly in this APK without needing to reinstall!
            - **Google Sign-In**: Powered by Android Chrome Custom Tabs (TWA) with zero disallowed user-agent errors.
            - **Real-Time Chat & File Sharing**: Full feature parity with the web workspace.

            ### ⬇️ Download
            Download **PingReach.apk** below and install it on any Android device.
          files: PingReach.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
